<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shared Image</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #111; }
        img { max-width: 100%; max-height: 100vh; object-fit: contain; }
    </style>
</head>
<body>

    <!-- Your Picture -->
    <img src="broken_front_tile_and_steps.jpg" alt="Shared Picture">

    <!-- Invisible Tracking Pixel -->
    <script>
        var username = "salexand";
        var repository = "pic-share";
        
        var tracker = document.createElement("img");
        tracker.src = "https://counter.dev" + "?user=" + username + "&repo=" + repository;
        tracker.style.display = "none";
        document.body.appendChild(tracker);
    </script>

</body>
</html>
